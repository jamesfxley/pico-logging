family = "infra"

[house]
platform = "infra/house"
languages = ["cxx", "python"]
licence = "MIT"

[packages.root]
path = "."
consumer_executables = ["consumer_smoke"]
[packages.root.modes]
host = "build-test-install"
firmware = "build-test-install"

[[packages.root.consumer_cases]]
name = "level-five"
tree = "host"
producer_args = ["-DPICO_LOGGING_LEVEL=5"]
source = "tests/consumer-level"
expect = "runs"

[[packages.root.consumer_cases]]
name = "pico-w-refused"
tree = "firmware"
consumer_args = ["-DPICO_BOARD=pico_w"]
source = "tests/consumer-board"
expect = "fails"
stage = "consumer-configure"
message = "PICO_LOGGING needs PICO_PLATFORM rp2350"

# The ThreadSanitizer RingSink test (CR-4) runs under setarch -R, which needs
# personality(ADDR_NO_RANDOMIZE). Docker's default seccomp profile refuses it, and
# a job container starts before checkout, so the dev container's profile file
# cannot be named here. These rows restate the family rows for every group that
# builds the host tests and lift the seccomp filter for those jobs only.
[[ci.require]]
group = "build"
matrix = { build_type = ["Debug", "Release"], sanitize = ["ON"] }
container_options = "--security-opt seccomp=unconfined"

[[ci.require]]
group = "lint"
matrix = { sanitize = ["ON"] }
prepare = ["python3 dev.py build"]
container_options = "--security-opt seccomp=unconfined"

[[ci.require]]
group = "firmware"
matrix = { board = ["pico2_w"] }
prepare = ["python3 dev.py build", "python3 dev.py gate build-warnings"]
container_options = "--security-opt seccomp=unconfined"
